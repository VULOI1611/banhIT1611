<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Văn Phòng Phẩm Online - Thanh Toán</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/payment.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
            <h1>VĂN PHÒNG PHẨM</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="products.html">Sản Phẩm</a></li>
                <li><a href="cart.html">Giỏ Hàng (<span id="cart-count">0</span>)</a></li>
                <li><a href="checkout.html">Giao Hàng</a></li>
                <li><a href="payment.html">Thanh Toán</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Thanh Toán</h2>
        <form id="payment-form">
            <label for="card-number">Số Thẻ:</label>
            <input type="text" id="card-number" required>
            <label for="datetime">Ngày Hết Hạn:</label>
            <input type="text" id="datetime" required placeholder="MM/YY">
            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" required>
            <button type="submit">Xác Nhận Thanh Toán</button>
        </form>
    </section>

    <footer>
        <p>&copy;Liên hệ <br> Số điện thoại: 0936506962 <br> Địa chỉ: 123 Lĩnh Nam - Hoàng Mai - Hà Nội</p>
    </footer>

    <script>
        // Hàm xử lý gửi thông tin thanh toán
        document.getElementById('payment-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Thanh toán thành công!');
            window.location.href = 'index.html'; // Chuyển về trang chủ
        });
    </script>
</body>

</html>
