<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Văn Phòng Phẩm Online</title>
    <link rel="stylesheet" href="styles/register.css">
</head>

<body>
    <header>
        <h1>Đăng Ký Tài Khoản</h1>
    </header>

    <section id="register">
        <form id="register-form">
            <label for="username">Tên đăng nhập:</label>
            <input type="text" id="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" required>

            <button type="submit">Đăng Ký</button>
        </form>
    </section>

    <footer>
        <p>&copy;Liên hệ <br> Số điện thoại: 0936506962 <br> Địa chỉ: 123 Lĩnh Nam - Hoàng Mai - Hà Nội</p>
    </footer>

    <script>
        document.getElementById('register-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Thêm logic đăng ký vào đây (lưu trữ thông tin vào localStorage hoặc gọi API)

            alert('Đăng ký thành công! Chào mừng ' + username);

            localStorage.setItem('username', username); // Lưu username
            localStorage.setItem('password', password); // Lưu password

            // Chuyển hướng đến trang đăng nhập hoặc trang chủ
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
