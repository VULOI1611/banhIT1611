<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Văn Phòng Phẩm Online - Giao Hàng</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/checkout.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="image/logo.png" alt="Logo">
            <h1>VĂN PHÒNG PHẨM</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="products.html">Sản Phẩm</a></li>
                <li><a href="cart.html">Giỏ Hàng (<span id="cart-count">0</span>)</a></li>
                <li><a href="checkout.html">Giao Hàng</a></li>
                <li><a href="cart.html">Thanh Toán</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Thông Tin Giao Hàng</h2>
        <form id="shipping-form">
            <label for="name">Họ Tên:</label>
            <input type="text" id="name" required>
            <label for="address">Địa Chỉ:</label>
            <input type="text" id="address" required>
            <label for="phone">Số Điện Thoại:</label>
            <input type="text" id="phone" required>
            <button type="submit">Tiếp Tục Thanh Toán</button>
        </form>
    </section>

    <footer>
        <p>&copy;Liên hệ <br> Số điện thoại: 0936506962 <br> Địa chỉ: 123 Lĩnh Nam - Hoàng Mai - Hà Nội</p>
    </footer>

    <script>
        // Hàm xử lý gửi thông tin giao hàng
        document.getElementById('shipping-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Thông tin giao hàng đã được gửi!');
            window.location.href = 'payment.html'; // Chuyển sang trang thanh toán
        });
    </script>
</body>

</html>
